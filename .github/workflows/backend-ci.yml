name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "!backend/README.md"
  pull_request:
    paths:
      - "backend/**"
      - "!backend/README.md"
  workflow_dispatch:

jobs:
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff (linter)
        run: uv run ruff check .

      - name: Run Ruff (formatter)
        run: uv run ruff format --check .

  type-check:
    name: 🔎 Type Check
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run mypy
        run: uv run mypy app/

  security:
    name: 🔒 Security
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Bandit
        run: uv run bandit -r app/

      - name: Run pip-audit
        run: uv run pip-audit
  smoke-test:
    name: 🚀 Smoke Test
    needs: lint
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    env:
      PROJECT_NAME: "NeSy"
      ENVIRONMENT: "development"
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_EXTRACTION_MODEL_NAME: ${{ secrets.LLM_EXTRACTION_MODEL_NAME }}
      LLM_XAI_MODEL_NAME: ${{ secrets.LLM_XAI_MODEL_NAME }}
      EMBEDDING_MODEL_NAME: ${{ secrets.EMBEDDING_MODEL_NAME }}
      HF_HUB_TOKEN: ${{ secrets.HF_HUB_TOKEN }}
      LLM_EXTRACTION_TEMPERATURE: "0.0"
      LLM_EXTRACTION_MAX_TOKENS: "1500"
      LLM_EXTRACTION_TOP_P: "1.0"
      LLM_EXTRACTION_SEED: "42"
      LLM_STREAM: "false"
      LLM_EXTRACTION_FORCE_JSON: "false"
      LLM_XAI_TEMPERATURE: "0.1"
      LLM_XAI_MAX_TOKENS: "2500"
      LLM_XAI_TOP_P: "1.0"
      LLM_XAI_SEED: "42"
      LLM_XAI_STREAM: "false"
      LLM_XAI_FORCE_JSON: "false"
      SEMANTIC_MATCHING_THRESHOLD: "0.9"
      MIN_MATCH: "2"
      SCORING_TOP_K: "5"
      SCORING_TOP_EXCLUDED: "3"
      ALLOWED_ORIGINS: "*"
      ALLOWED_METHODS: "*"
      ALLOWED_HEADERS: "*"
      ALLOW_CREDENTIALS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Start FastAPI server
        run: |
          uv run fastapi dev app/main.py &
          echo "Waiting for server to start..."
          sleep 100

      - name: Check health endpoint
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health

      - name: Check root endpoint
        run: |
          curl --fail http://localhost:8000/
