name: Test Notebook Setup Scripts

on:
  push:
    paths:
      - "notebooks/setup.sh"
      - "notebooks/setup.bat"
      - "notebooks/pyproject.toml"
      - "notebooks/uv.lock"
  pull_request:
    paths:
      - "notebooks/setup.sh"
      - "notebooks/setup.bat"
      - "notebooks/pyproject.toml"
      - "notebooks/uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: 🐧 Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: notebooks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run setup script
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Verify kernel installed
        run: uv run jupyter kernelspec list | grep nesy-notebooks

  test-macos:
    name: 🍎 macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: notebooks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run setup script
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Verify kernel installed
        run: uv run jupyter kernelspec list | grep nesy-notebooks

  test-windows:
    name: 🖥️ Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: notebooks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run setup script
        run: ./setup.bat
        shell: cmd

      - name: Verify kernel installed
        run: uv run jupyter kernelspec list | findstr nesy-notebooks
        shell: cmd
