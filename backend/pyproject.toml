[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nesy-x-backend"
version = "1.0.0"
description = "FastAPI backend and neuro-symbolic reasoning engine for NeSy-X"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "fastapi-cli==0.0.24",
    "uvicorn==0.41.0",
    "neo4j==6.1.0",
    "groq==1.0.0",
    "openai==2.36.0",
    "numpy==2.4.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "sentence-transformers==5.2.3",
    "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.12",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pip-audit==2.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
