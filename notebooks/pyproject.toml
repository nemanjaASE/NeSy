[project]
name = "nesy-x-notebooks"
version = "1.0.0"
description = "Jupyter notebooks for NeSy-X data preparation, execution-layer demonstrations, and visual exploration"
requires-python = ">=3.12"
dependencies = [
    "neo4j==6.1.0",
    "python-dotenv==1.2.2",
    "sentence-transformers==5.3.0",
    "scikit-learn==1.8.0",
    "numpy==2.4.3",
    "matplotlib==3.11.1",
    "plotly==7.0.0",
    "groq==1.1.1",
    "openai==3.6.0",
    "psutil==7.2.2",
    "gputil==1.4.0",
    "jupyter==1.1.1",
    "ipykernel==7.2.0",
]

[project.optional-dependencies]
dev = [
    "nbstripout==0.9.1",
    "nbconvert==7.17.0",
]

[tool.uv]
package = false
