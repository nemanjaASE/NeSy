remote_theme: just-the-docs/just-the-docs@v0.12.0
title: NeSy-X
description: Neuro-Symbolic eXplainable Framework for Diagnostic Support
color_scheme: nesy
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
plugins:
  - jekyll-remote-theme
exclude: [vendor]

search_enabled: true
heading_anchors: true
enable_copy_code_button: true

mermaid:
  version: "11.17.2"

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

aux_links:
  "NeSy-X on GitHub":
    - "https://github.com/nemanjaASE/NeSy-X"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/nemanjaASE/NeSy-X"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"
